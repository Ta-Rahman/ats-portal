# nginx im web-Container: liefert die gebaute SPA aus und leitet /api/ an den api-Dienst weiter.

# Status-Links enthalten den Zugangs-Token im Pfad (/status/<token>, /api/status/<token>).
# Für das Access-Log wird der Token durch [token] ersetzt; der Referer wird nicht protokolliert.
# Query-Strings werden auf allen Routen weggelassen (Iteration 5): Sie können Tokens oder andere
# Eingaben tragen; das Zugriffsprotokoll der API protokolliert ebenfalls nur den Pfad.
# Die erste passende Regel gilt; die zweite passt auf jede Anfrage.
# (map und log_format stehen hier auf http-Ebene, weil conf.d/*.conf in http { } eingebunden wird.)
map $request_uri $ats_log_uri {
    "~^(?<ats_prefix>/(?:api/)?status/)[^/?#]+(?<ats_rest>[^?#]*)"  "${ats_prefix}[token]${ats_rest}";
    "~^(?<ats_path>[^?#]*)"                                        "${ats_path}";
}

log_format ats_redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $ats_log_uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent"';

# API mit wiederverwendeten Verbindungen (Iteration 5). Ohne keepalive öffnet nginx je Anfrage eine
# neue TCP-Verbindung zur API; die geschlossenen bleiben ca. 60 s im Zustand TIME_WAIT. Im Lasttest
# (≈ 1 300 Anfragen/s) waren damit die lokalen Ports des web-Containers (32768–60999) erschöpft →
# connect() failed (99: Address not available) → 502. Jetzt hält jeder nginx-Worker bis zu 16 freie
# Verbindungen offen. keepalive_timeout 4s liegt unter dem Leerlauf-Timeout von Node (5 s), damit nginx
# keine Verbindung wiederverwendet, die die API gerade schließt.
# Voraussetzung in jeder proxy-Location: proxy_http_version 1.1 und leerer Connection-Header.
upstream ats_api {
    server api:3000;
    keepalive 16;
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log ats_redacted;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Lebenslauf bis 5 MB plus Formularfelder und multipart-Rahmen (nginx-Standard wäre 1 MB).
        client_max_body_size 6m;
        proxy_pass http://ats_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Status-Link der Bewerber:innen: Bei Fehlern der API (502/504, Level "error") schreibt nginx die
    # vollständige Anfragezeile samt Token ins Fehlerlog; ein Format dafür lässt sich nicht einstellen.
    # Für diese Routen daher nur kritische Fehler protokollieren. Diagnose über das Access-Log
    # (Token maskiert) und das Zugriffsprotokoll der API. Übrige Routen behalten das volle Fehlerlog.
    location /api/status/ {
        error_log /dev/stderr crit;
        proxy_pass http://ats_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-Routen der SPA (z. B. /stellen/3) auf index.html abbilden.
    location / {
        # Kein Referer an andere Seiten oder an eigene Anfragen – sonst würde die URL der
        # Statusseite samt Token mitgeschickt. (API-Antworten setzt helmet ebenso.)
        add_header Referrer-Policy "no-referrer" always;
        # Content-Security-Policy der SPA (Iteration 5, Schrift ab Iteration 6). Der Vite-Build besteht
        # nur aus einem Modul-Skript und einer CSS-Datei unter /assets/, dazu Schrift, Logo und Favicon
        # aus public/ – kein Inline-Code, kein eval, keine data:-URIs, kein CDN. Daher:
        #   default-src 'none'       alles, was nicht ausdrücklich erlaubt ist, wird blockiert
        #   script-src 'self'        nur das eigene Bundle (kein 'unsafe-inline', kein 'unsafe-eval')
        #   style-src 'self'         nur die eigene CSS-Datei (Vue setzt Stile per CSSOM, das ist erlaubt)
        #   font-src 'self'          nur die selbst gehostete Schrift /fonts/geist-latin-wght-normal.woff2
        #   img-src 'self'           eigene Bilder (Logo /marke/…, Favicon), kein data:
        #   connect-src 'self'       fetch() an /api auf demselben Host
        #   base-uri, form-action    kein fremdes <base>, Formulare nur an die eigene Herkunft
        #   frame-ancestors 'none'   Seite darf nicht eingebettet werden (Clickjacking)
        # Gilt nur hier: /api/ sendet die eigene, strengere Policy der API (helmet in api/src/app.js).
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
